<!DOCTYPE html>
<html lang="zh-TW">
    
<head>
    <meta charset="UTF-8">
    <title>3D 針孔成像模擬器</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #e0e0e0;
            font-family: "Microsoft JhengHei", sans-serif;
            color: #333;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            pointer-events: auto;
            user-select: none;
            width: 280px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h3 {
            margin: 0 0 10px 0;
            border-bottom: 1px solid #f0e8e8;
            padding-bottom: 5px;
            color: #222;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h3 .toggle-arrow {
            font-size: 12px;
            color: #999;
            transition: transform 0.2s;
        }

        h3:hover {
            color: #0066cc;
        }

        h3:hover .toggle-arrow {
            color: #0066cc;
        }

        .highlight {
            color: #0066cc;
            font-weight: bold;
        }

        .status {
            color: #d32f2f;
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }

        .hint-text {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin-top: 15px;
        }



        input[type=checkbox] {
            transform: scale(1.5);
            margin-right: 10px;
            cursor: pointer;
        }

        #resetBtn {
            width: 100%;
            padding: 8px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
            transition: background 0.2s;
        }

        #resetBtn:hover {
            background-color: #e0e0e0;
            border-color: #999;
        }

        .section-label {
            font-size: 13px;
            font-weight: bold;
            color: #666;
            margin-top: 12px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .led-toggle-row {
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
        }

        .led-toggle-row input[type=checkbox] {
            transform: scale(1.3);
            margin-right: 8px;
        }

        .led-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        #sourceMode,
        #pinholeCount {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            color: #333;
            background: #f8f8f8;
            cursor: pointer;
            margin-bottom: 8px;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <div id="info">
        <h3 id="panelToggle">3D 針孔成像實驗室 <span class="toggle-arrow">▼</span></h3>

        <div id="panelBody">
            <div class="section-label">💡 光源模式</div>
            <select id="sourceMode">
                <option value="led3">三色 LED (紅藍綠)</option>
                <option value="letterF">字母 F</option>
            </select>

            <div id="ledToggles">
                <label class="led-toggle-row">
                    <input type="checkbox" id="toggleRed" checked>
                    <span class="led-dot" style="background:#ff0000;"></span>
                    <span>紅色 LED</span>
                </label>
                <label class="led-toggle-row">
                    <input type="checkbox" id="toggleBlue" checked>
                    <span class="led-dot" style="background:#0000ff;"></span>
                    <span>藍色 LED</span>
                </label>
                <label class="led-toggle-row">
                    <input type="checkbox" id="toggleGreen" checked>
                    <span class="led-dot" style="background:#4da72e;"></span>
                    <span>綠色 LED</span>
                </label>
            </div>

            <div class="section-label">📌 針孔設定</div>
            <select id="pinholeCount">
                <option value="1">1 個針孔</option>
                <option value="2">2 個針孔</option>
                <option value="3">3 個針孔</option>
            </select>



            <button id="resetBtn">↺ 重置位置</button>

            <div class="hint-text">
                1. <span class="highlight">拖曳</span> 懸浮組件 (僅限X軸)<br>
                2. <span class="highlight">視角</span> 按住左鍵旋轉<br>
                <br>
                <span id="debugText">系統就緒</span><br>
                <span id="dragStatus" class="status"></span>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==========================================
        // 🔧 參數設定區 (XYZ 自由配置)
        // ==========================================
        const CONFIG = {
            // [位置設定 - X軸] (前後距離)
            posX_Source: -80,
            posX_Pinhole: 0,
            posX_Screen: 100,

            // [位置設定 - Y軸] (垂直高度)
            posY_Source: 40,
            posY_Pinhole: 40,
            posY_Screen: 40,

            // [位置設定 - Z軸] (左右偏移，正值為畫面內/左，負值為畫面外/右)
            // 您可以在這裡設定 Z 軸錯位
            posZ_Source: 0,
            posZ_Pinhole: 0,
            posZ_Screen: -20,

            // [尺寸設定]
            screenWidth: 160,
            screenHeight: 240,
            wallSize: 60,
            pinholeSpacing: 15,  // 多針孔間距 (Z軸)

            floorY: -30,

            ledSpacing: 16,
            ledRadius: 4,
            colorRed: 0xff0000,
            colorBlue: 0x0000ff,
            colorGreen: 0x4da72e,

            // 字母 F 模式
            fDotRadius: 2.5,
            fSpacing: 8,
            colorF: 0xffcc00
        };

        // 1. 場景設置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe0e0e0);

        const gridHelper = new THREE.GridHelper(500, 50, 0x888888, 0xbbbbbb);
        gridHelper.position.y = CONFIG.floorY;
        scene.add(gridHelper);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(60, 140, 300);
        camera.lookAt(0, CONFIG.posY_Pinhole, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xcccccc);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(50, 150, 50);
        scene.add(dirLight);

        // --- 材質定義 ---
        const matWall = new THREE.MeshLambertMaterial({
            color: 0x999999,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.7,
            depthWrite: false
        });

        const matScreen = new THREE.MeshLambertMaterial({
            color: 0xfad5be,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.3,
            depthWrite: false
        });

        function createHitBox(w, h, d) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshBasicMaterial({ visible: false });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.userData = { isHitBox: true };
            return mesh;
        }

        // --- 建立物件群組 ---

        // A. 光源組
        const sourceGroup = new THREE.Group();
        // 使用 CONFIG 中的 X, Y, Z
        sourceGroup.position.set(CONFIG.posX_Source, CONFIG.posY_Source, CONFIG.posZ_Source);
        sourceGroup.userData = { name: "光源 (Object)" };
        scene.add(sourceGroup);
        sourceGroup.add(createHitBox(20, 60, 60));

        function createLED(color, x, y, z) {
            const geo = new THREE.SphereGeometry(CONFIG.ledRadius, 32, 32);
            const mat = new THREE.MeshBasicMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.add(new THREE.PointLight(color, 3, 100));
            return mesh;
        }
        const redLED = createLED(CONFIG.colorRed, 0, 0, 0);
        const blueLED = createLED(CONFIG.colorBlue, 0, CONFIG.ledSpacing, 0);
        const greenLED = createLED(CONFIG.colorGreen, 0, 0, CONFIG.ledSpacing);
        sourceGroup.add(redLED, blueLED, greenLED);

        // --- 字母 F 光源 ---
        // F 形狀定義 (行, 列) - 5 行 x 4 列
        // # # # #   (row 4, 頂部)
        // #           (row 3)
        // # # #       (row 2, 中間)
        // #           (row 1)
        // #           (row 0, 底部)
        const F_SHAPE = [
            [0, 0], [1, 0], [2, 0], [2, 1], [2, 2],
            [3, 0], [4, 0], [4, 1], [4, 2], [4, 3]
        ];
        const fCenterY = 2 * CONFIG.fSpacing;
        const fCenterZ = 1.5 * CONFIG.fSpacing;

        const fLEDs = [];
        const fGroup = new THREE.Group();
        fGroup.visible = false;

        function createFDot(y, z) {
            const geo = new THREE.SphereGeometry(CONFIG.fDotRadius, 16, 16);
            const mat = new THREE.MeshBasicMaterial({ color: CONFIG.colorF });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(0, y, z);
            mesh.add(new THREE.PointLight(CONFIG.colorF, 1, 60));
            return mesh;
        }

        F_SHAPE.forEach(([row, col]) => {
            const y = row * CONFIG.fSpacing - fCenterY;
            const z = col * CONFIG.fSpacing - fCenterZ;
            const dot = createFDot(y, z);
            fGroup.add(dot);
            fLEDs.push(dot);
        });
        sourceGroup.add(fGroup);


        // B. 針孔組
        const pinholeGroup = new THREE.Group();
        pinholeGroup.position.set(CONFIG.posX_Pinhole, CONFIG.posY_Pinhole, CONFIG.posZ_Pinhole);
        pinholeGroup.userData = { name: "針孔 (Pinhole)" };
        scene.add(pinholeGroup);
        pinholeGroup.add(createHitBox(10, CONFIG.wallSize, CONFIG.wallSize));

        const wall = new THREE.Mesh(new THREE.BoxGeometry(2, CONFIG.wallSize, CONFIG.wallSize), matWall);
        pinholeGroup.add(wall);

        const holeRadius = 0.5;
        // 建立 3 個針孔 (holeTube)，根據選擇顯示 1~3 個
        const MAX_PINHOLES = 3;
        const holeTubes = [];
        const pinholeZOffsets = [0, -CONFIG.pinholeSpacing, CONFIG.pinholeSpacing]; // 中、左、右
        for (let p = 0; p < MAX_PINHOLES; p++) {
            const tube = new THREE.Mesh(
                new THREE.CylinderGeometry(holeRadius, holeRadius, 2.2, 32),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            tube.rotation.z = Math.PI / 2;
            tube.position.z = pinholeZOffsets[p];
            tube.visible = (p === 0); // 預設只顯示第 1 個
            pinholeGroup.add(tube);
            holeTubes.push(tube);
        }


        // C. 屏幕組
        const screenGroup = new THREE.Group();
        screenGroup.position.set(CONFIG.posX_Screen, CONFIG.posY_Screen, CONFIG.posZ_Screen);
        screenGroup.userData = { name: "屏幕 (Screen)" };
        scene.add(screenGroup);
        screenGroup.add(createHitBox(10, CONFIG.screenHeight, CONFIG.screenWidth));

        const screenPlate = new THREE.Mesh(new THREE.BoxGeometry(2, CONFIG.screenHeight, CONFIG.screenWidth), matScreen);
        screenGroup.add(screenPlate);

        // 平面成像點 (Ghosts)
        function createGhost(color) {
            const geo = new THREE.CircleGeometry(CONFIG.ledRadius, 32);
            const mat = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.9,
                side: THREE.DoubleSide,
                depthTest: true,
                depthWrite: true
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.y = -Math.PI / 2;
            mesh.renderOrder = 2;
            return mesh;
        }
        // 為每個針孔建立一組 ghost (3色LED用 + 字母F用)
        // ghosts3LED[p] = { red, blue, green }  (p = 針孔索引)
        // ghostsF[p] = [ghost0, ghost1, ... ghost9]
        const ghosts3LED = [];
        const ghostsF = [];

        function createFGhost() {
            const geo = new THREE.CircleGeometry(CONFIG.fDotRadius, 16);
            const mat = new THREE.MeshBasicMaterial({
                color: CONFIG.colorF,
                transparent: true,
                opacity: 0.9,
                side: THREE.DoubleSide,
                depthTest: true,
                depthWrite: true
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.y = -Math.PI / 2;
            mesh.renderOrder = 2;
            mesh.visible = false;
            return mesh;
        }

        for (let p = 0; p < MAX_PINHOLES; p++) {
            const rg = createGhost(CONFIG.colorRed);
            const bg = createGhost(CONFIG.colorBlue);
            const gg = createGhost(CONFIG.colorGreen);
            if (p > 0) { rg.visible = false; bg.visible = false; gg.visible = false; }
            screenGroup.add(rg, bg, gg);
            ghosts3LED.push({ red: rg, blue: bg, green: gg });

            const fSet = F_SHAPE.map(() => { const g = createFGhost(); screenGroup.add(g); return g; });
            ghostsF.push(fSet);
        }


        // ==========================================
        // 🔦 光路系統
        // ==========================================

        const rayMatBase = {
            transparent: true,
            opacity: 0.8,
            linewidth: 2,
            depthTest: false
        };
        const rayMatRed = new THREE.LineBasicMaterial({ color: CONFIG.colorRed, ...rayMatBase });
        const rayMatBlue = new THREE.LineBasicMaterial({ color: CONFIG.colorBlue, ...rayMatBase });
        const rayMatGreen = new THREE.LineBasicMaterial({ color: CONFIG.colorGreen, ...rayMatBase });
        const rayMatF = new THREE.LineBasicMaterial({ color: CONFIG.colorF, ...rayMatBase });

        function createRay(mat) {
            const line = new THREE.Line(new THREE.BufferGeometry(), mat);
            line.renderOrder = 1;
            scene.add(line);
            return line;
        }
        // 為每個針孔建立一組 ray
        // rays3LED[p] = { red, blue, green }
        // raysF[p] = [ray0..ray9]
        const rays3LED = [];
        const raysF = [];

        for (let p = 0; p < MAX_PINHOLES; p++) {
            rays3LED.push({
                red: createRay(rayMatRed),
                blue: createRay(rayMatBlue),
                green: createRay(rayMatGreen)
            });
            const fRaySet = F_SHAPE.map(() => createRay(rayMatF));
            fRaySet.forEach(r => r.visible = false);
            raysF.push(fRaySet);
        }


        // --- 互動與控制 ---

        const orbitControls = new OrbitControls(camera, renderer.domElement);
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        // 拖曳平面 (高度設為針孔高度，以保證操作手感)
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -CONFIG.posY_Pinhole);

        let isDragging = false;
        let selectedGroup = null;
        let dragOffset = 0;
        const debugText = document.getElementById('debugText');
        const dragStatus = document.getElementById('dragStatus');

        // 面板收合/展開
        const panelToggle = document.getElementById('panelToggle');
        const panelBody = document.getElementById('panelBody');
        const toggleArrow = panelToggle.querySelector('.toggle-arrow');
        panelToggle.addEventListener('click', () => {
            const isHidden = panelBody.style.display === 'none';
            panelBody.style.display = isHidden ? 'block' : 'none';
            toggleArrow.textContent = isHidden ? '▼' : '▶';
        });

        const resetBtn = document.getElementById('resetBtn');
        const toggleRed = document.getElementById('toggleRed');
        const toggleBlue = document.getElementById('toggleBlue');
        const toggleGreen = document.getElementById('toggleGreen');
        const sourceModeSelect = document.getElementById('sourceMode');
        const ledTogglesDiv = document.getElementById('ledToggles');
        const pinholeCountSelect = document.getElementById('pinholeCount');

        // 光源模式切換
        sourceModeSelect.addEventListener('change', () => {
            const isF = sourceModeSelect.value === 'letterF';
            ledTogglesDiv.style.display = isF ? 'none' : 'block';
            switchSourceMode(isF);
        });

        function switchSourceMode(isF) {
            // 切換三色 LED vs 字母 F
            redLED.visible = !isF;
            blueLED.visible = !isF;
            greenLED.visible = !isF;
            fGroup.visible = isF;
            updateSystem();
        }

        // 針孔數量切換
        pinholeCountSelect.addEventListener('change', () => {
            const count = parseInt(pinholeCountSelect.value);
            for (let p = 0; p < MAX_PINHOLES; p++) {
                holeTubes[p].visible = (p < count);
            }
            updateSystem();
        });

        // 燈光開關事件
        toggleRed.addEventListener('change', updateSystem);
        toggleBlue.addEventListener('change', updateSystem);
        toggleGreen.addEventListener('change', updateSystem);

        resetBtn.addEventListener('click', () => {
            // 重置為 CONFIG 設定值
            sourceGroup.position.set(CONFIG.posX_Source, CONFIG.posY_Source, CONFIG.posZ_Source);
            pinholeGroup.position.set(CONFIG.posX_Pinhole, CONFIG.posY_Pinhole, CONFIG.posZ_Pinhole);
            screenGroup.position.set(CONFIG.posX_Screen, CONFIG.posY_Screen, CONFIG.posZ_Screen);
            updateSystem();
            dragStatus.innerText = "已重置位置";
            setTimeout(() => dragStatus.innerText = "", 1000);
        });



        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mouseup', onMouseUp);

        function getIntersects(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const objectsToCheck = [...sourceGroup.children, ...pinholeGroup.children, ...screenGroup.children];
            return raycaster.intersectObjects(objectsToCheck, true);
        }

        function onMouseDown(event) {
            const intersects = getIntersects(event);
            if (intersects.length > 0) {
                let target = intersects[0].object;
                while (target.parent && target.parent !== scene) {
                    if (target.parent === sourceGroup || target.parent === pinholeGroup || target.parent === screenGroup) {
                        target = target.parent;
                        break;
                    }
                    target = target.parent;
                }
                if (target === sourceGroup || target === pinholeGroup || target === screenGroup) {
                    isDragging = true;
                    selectedGroup = target;
                    orbitControls.enabled = false;
                    const planeIntersect = new THREE.Vector3();
                    raycaster.ray.intersectPlane(dragPlane, planeIntersect);
                    dragOffset = selectedGroup.position.x - planeIntersect.x;
                    dragStatus.innerText = `正在拖曳: ${selectedGroup.userData.name}`;
                    document.body.style.cursor = 'grabbing';
                }
            }
        }

        function onMouseMove(event) {
            if (isDragging && selectedGroup) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const planeIntersect = new THREE.Vector3();
                if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                    let newX = planeIntersect.x + dragOffset;
                    const minGap = 12;

                    // 拖曳邏輯：只改變 X 軸，保持 Y 和 Z 不變
                    if (selectedGroup === sourceGroup) {
                        const limit = pinholeGroup.position.x - minGap;
                        if (newX > limit) newX = limit;
                        sourceGroup.position.x = newX;
                    } else if (selectedGroup === pinholeGroup) {
                        const leftLimit = sourceGroup.position.x + minGap;
                        const rightLimit = screenGroup.position.x - minGap;
                        if (newX < leftLimit) newX = leftLimit;
                        if (newX > rightLimit) newX = rightLimit;
                        pinholeGroup.position.x = newX;
                    } else if (selectedGroup === screenGroup) {
                        const limit = pinholeGroup.position.x + minGap;
                        if (newX < limit) newX = limit;
                        screenGroup.position.x = newX;
                    }
                    updateSystem();
                }
            } else {
                const intersects = getIntersects(event);
                if (intersects.length > 0) document.body.style.cursor = 'grab';
                else document.body.style.cursor = 'default';
            }
        }

        function onMouseUp() {
            isDragging = false; selectedGroup = null; orbitControls.enabled = true;
            dragStatus.innerText = ""; document.body.style.cursor = 'default';
        }


        // --- 物理系統更新 (XYZ 全方位修正，支援多針孔) ---
        function updateSystem() {
            const xSrc = sourceGroup.position.x;
            const xPin = pinholeGroup.position.x;
            const xScr = screenGroup.position.x;

            const ySrc = sourceGroup.position.y;
            const yPin = pinholeGroup.position.y;
            const yScr = screenGroup.position.y;

            const zSrc = sourceGroup.position.z;
            const zPin = pinholeGroup.position.z;
            const zScr = screenGroup.position.z;

            const do_dist = xPin - xSrc;
            const di_dist = xScr - xPin;

            if (do_dist <= 0.1) return;

            const M = di_dist / do_dist;
            const activePinholes = parseInt(pinholeCountSelect.value);

            debugText.innerHTML = `物距: ${do_dist.toFixed(0)} | 像距: ${di_dist.toFixed(0)} | 放大率: ${M.toFixed(2)}X | 針孔: ${activePinholes}`;

            const ghostScale = M;
            const isF = sourceModeSelect.value === 'letterF';

            // 控制 LED 球體本身的可見性
            redLED.visible = !isF && toggleRed.checked;
            blueLED.visible = !isF && toggleBlue.checked;
            greenLED.visible = !isF && toggleGreen.checked;
            fGroup.visible = isF;

            // 輔助函式：計算某個 LED 通過某個針孔在屏幕上的投影位置
            // ledWorldPos: LED 的世界座標
            // pinWorldPos: 針孔的世界座標
            // 回傳: 在 screenGroup 本地座標系中的 (y, z) 偏移
            function calcProjection(ledWorldY, ledWorldZ, pinWorldY, pinWorldZ) {
                const slopeY = (pinWorldY - ledWorldY) / do_dist;
                const projY = pinWorldY + slopeY * di_dist;
                const slopeZ = (pinWorldZ - ledWorldZ) / do_dist;
                const projZ = pinWorldZ + slopeZ * di_dist;
                return {
                    y: projY - yScr,
                    z: projZ - zScr
                };
            }

            function updateOptics(rayLine, ledObj, ghostObj, pinPos) {
                const ledPos = new THREE.Vector3();
                const ghostPos = new THREE.Vector3();
                ledObj.getWorldPosition(ledPos);
                ghostObj.getWorldPosition(ghostPos);
                rayLine.visible = true;
                rayLine.geometry.setFromPoints([ledPos, ghostPos]);
            }

            function hideRay(ray) {
                ray.visible = false;
            }

            // 逐針孔處理
            for (let p = 0; p < MAX_PINHOLES; p++) {
                const isActive = p < activePinholes;
                const pinPos = new THREE.Vector3();
                if (isActive) holeTubes[p].getWorldPosition(pinPos);

                const pinWorldY = isActive ? pinPos.y : 0;
                const pinWorldZ = isActive ? pinPos.z : 0;

                if (!isF) {
                    // ========== 三色 LED 模式 ==========
                    const g = ghosts3LED[p];
                    const r = rays3LED[p];

                    if (!isActive) {
                        g.red.visible = false; g.blue.visible = false; g.green.visible = false;
                        hideRay(r.red); hideRay(r.blue); hideRay(r.green);
                    } else {
                        const redLedWorldY = ySrc;
                        const redLedWorldZ = zSrc;
                        const blueLedWorldY = ySrc + CONFIG.ledSpacing;
                        const blueLedWorldZ = zSrc;
                        const greenLedWorldY = ySrc;
                        const greenLedWorldZ = zSrc + CONFIG.ledSpacing;

                        const projRed = calcProjection(redLedWorldY, redLedWorldZ, pinWorldY, pinWorldZ);
                        const projBlue = calcProjection(blueLedWorldY, blueLedWorldZ, pinWorldY, pinWorldZ);
                        const projGreen = calcProjection(greenLedWorldY, greenLedWorldZ, pinWorldY, pinWorldZ);

                        g.red.position.set(-2.0, projRed.y, projRed.z);
                        g.red.scale.set(ghostScale, ghostScale, 1);
                        g.blue.position.set(-2.0, projBlue.y, projBlue.z);
                        g.blue.scale.set(ghostScale, ghostScale, 1);
                        g.green.position.set(-2.0, projGreen.y, projGreen.z);
                        g.green.scale.set(ghostScale, ghostScale, 1);

                        // LED 開關
                        function setVis(enabled, ghost, ray) {
                            ghost.visible = enabled;
                            if (!enabled) hideRay(ray);
                        }
                        setVis(toggleRed.checked, g.red, r.red);
                        setVis(toggleBlue.checked, g.blue, r.blue);
                        setVis(toggleGreen.checked, g.green, r.green);

                        if (toggleRed.checked) updateOptics(r.red, redLED, g.red, pinPos);
                        if (toggleBlue.checked) updateOptics(r.blue, blueLED, g.blue, pinPos);
                        if (toggleGreen.checked) updateOptics(r.green, greenLED, g.green, pinPos);
                    }

                    // 隱藏此針孔的 F 模式元素
                    ghostsF[p].forEach(g => g.visible = false);
                    raysF[p].forEach(r => r.visible = false);

                } else {
                    // ========== 字母 F 模式 ==========
                    const g = ghosts3LED[p];
                    const r = rays3LED[p];

                    // 隱藏三色 LED 元素
                    g.red.visible = false; g.blue.visible = false; g.green.visible = false;
                    hideRay(r.red); hideRay(r.blue); hideRay(r.green);

                    if (!isActive) {
                        ghostsF[p].forEach(fg => fg.visible = false);
                        raysF[p].forEach(fr => fr.visible = false);
                    } else {
                        F_SHAPE.forEach(([row, col], i) => {
                            const ledLocalY = row * CONFIG.fSpacing - fCenterY;
                            const ledLocalZ = col * CONFIG.fSpacing - fCenterZ;
                            const ledWorldY = ySrc + ledLocalY;
                            const ledWorldZ = zSrc + ledLocalZ;

                            const proj = calcProjection(ledWorldY, ledWorldZ, pinWorldY, pinWorldZ);

                            ghostsF[p][i].visible = true;
                            ghostsF[p][i].position.set(-2.0, proj.y, proj.z);
                            ghostsF[p][i].scale.set(ghostScale, ghostScale, 1);

                            updateOptics(raysF[p][i], fLEDs[i], ghostsF[p][i], pinPos);
                        });
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        updateSystem();
        animate();

    </script>
</body>

</html>
